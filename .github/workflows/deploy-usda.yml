name: Deploy laporan-usda.html with Admin Tokens

on:
  push:
    branches:
      - main
    paths:
      - 'laporan-usda.html'
      - '.github/workflows/deploy-usda.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Inject admin tokens into laporan-usda.html
        env:
          USDA_TOKEN_PRIMARY: ${{ secrets.USDA_ADMIN_TOKEN_PRIMARY }}
          USDA_TOKEN_BACKUP: ${{ secrets.USDA_ADMIN_TOKEN_BACKUP }}
        run: |
          if [ -z "$USDA_TOKEN_PRIMARY" ] || [ -z "$USDA_TOKEN_BACKUP" ]; then
            echo "ERROR: GitHub Secrets not set!"
            echo "Please add USDA_ADMIN_TOKEN_PRIMARY and USDA_ADMIN_TOKEN_BACKUP in repo settings"
            exit 1
          fi
          
          sed -i "s|__USDA_ADMIN_TOKEN_PRIMARY__|$USDA_TOKEN_PRIMARY|g" laporan-usda.html
          sed -i "s|__USDA_ADMIN_TOKEN_BACKUP__|$USDA_TOKEN_BACKUP|g" laporan-usda.html
          
          echo "✓ Tokens injected successfully"
          
      - name: Verify tokens were injected
        run: |
          if grep -q "__USDA_ADMIN_TOKEN_PRIMARY__" laporan-usda.html; then
            echo "ERROR: Token placeholder still in file!"
            exit 1
          fi
          echo "✓ Tokens verified in file"
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add laporan-usda.html
          git commit -m "chore: inject admin tokens [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"
