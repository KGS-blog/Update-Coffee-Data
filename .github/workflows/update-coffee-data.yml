# QCO Data Pipeline — update-coffee-data.yml — v2026.09.24-4
# WAJIB berada di: .github/workflows/update-coffee-data.yml
# Cron: tiap 6 jam (harga) — BPS ikut ter-fetch tiap run (aman, tidak menambah beban berarti)
name: Update Coffee Market Data

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest data
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: node scripts/fetch.js
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "data: update [$(date -u +%Y-%m-%d %H:%M UTC)]" && git push)
