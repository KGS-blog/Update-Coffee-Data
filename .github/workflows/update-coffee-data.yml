# QCO Data Pipeline — update-coffee-data.yml — v2026.09.24-13
# WAJIB berada di: .github/workflows/update-coffee-data.yml
# Cron: tiap 6 jam (harga) — BPS ikut ter-fetch tiap run (aman, tidak menambah beban berarti)
name: Update Coffee Market Data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-coffee-data.yml'
      - 'scripts/process-portal-data.js'
      - 'scripts/fetch-news-context.py'
      - 'scripts/render-static-mevo-previews.js'
      - 'scripts/render-static-news.js'
      - 'scripts/generate-discovery-pages.js'
      - 'scripts/generate-editorial-pages.js'
      - 'scripts/generate-weekly-brief.js'
      - 'scripts/import-mevo-price-data.js'
      - 'scripts/import-ico-trade-data.js'
      - 'scripts/import-coffee-reference-articles.js'
      - 'scripts/merge-coffee-reference-articles.js'
      - 'scripts/fetch-coffee-reference-articles.py'
      - 'scripts/merge-public-price-sources.js'
      - 'scripts/render-static-coffee-price-chart.js'
      - 'scripts/templates/kabar-kopi.html'
      - 'data/editorial-settings.json'
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest data
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: node scripts/fetch.js
      - name: Import annual Indonesian coffee exports from ICO
        run: node scripts/import-ico-trade-data.js
      - name: Save MEVO coffee price listings in Kabar Kopi
        run: node scripts/import-mevo-price-data.js
      - name: Fetch public price catalogues and approved or previously imported admin OCR listings
        env:
          MEVO_SYNC_SECRET: ${{ secrets.MEVO_SYNC_SECRET }}
        run: node scripts/merge-public-price-sources.js
      - name: Import deduplicated coffee reference articles
        env:
          COFFEE_ENGINE_READ_TOKEN: ${{ secrets.COFFEE_ENGINE_READ_TOKEN }}
        run: node scripts/import-coffee-reference-articles.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch original coffee reference article URLs
        env:
          COFFEE_REFERENCE_FETCH_LIMIT: '400'
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir lxml pypdf
          python scripts/fetch-coffee-reference-articles.py
      - name: Merge curated references into searchable feed and clustering input
        run: node scripts/merge-coffee-reference-articles.js
      - name: Fetch original article context for clustering
        env:
          COFFEE_NEWS_CONTEXT_FETCH_LIMIT: '400'
        run: python scripts/fetch-news-context.py
      - name: Load private editor cluster queue
        env:
          MEVO_SYNC_SECRET: ${{ secrets.MEVO_SYNC_SECRET }}
        run: |
          if [ -z "$MEVO_SYNC_SECRET" ]; then echo "::warning::MEVO_SYNC_SECRET belum disetel; antrean klaster masih memakai berkas repo sementara."; exit 0; fi
          endpoint='https://blog-api.qcoid.com/api/internal/cluster-candidates'
          response="$(curl --fail --silent --show-error -H "Authorization: Bearer $MEVO_SYNC_SECRET" "$endpoint")" || { echo "::warning::Penyimpanan antrean D1 belum siap; pembaruan data utama tetap berjalan."; exit 0; }
          if printf '%s' "$response" | node -e 'let raw=""; process.stdin.on("data", chunk => raw += chunk); process.stdin.on("end", () => process.exit(JSON.parse(raw).needs_seed ? 0 : 1));'; then
            response="$(curl --fail --silent --show-error 'https://raw.githubusercontent.com/KGS-blog/Update-Coffee-Data/main/data/cluster-candidates.json')" || { echo "::warning::Antrean klaster belum ada; pembaruan data utama tetap berjalan."; exit 0; }
            curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $MEVO_SYNC_SECRET" -H 'Content-Type: application/json' --data-binary "$response" "$endpoint" >/dev/null || { echo "::warning::Migrasi D1 diperlukan; pembaruan data utama tetap berjalan."; exit 0; }
          fi
          printf '%s\n' "$response" > data/cluster-candidates.json
      - name: Index archive, apply clustering decisions, and generate editorial
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/process-portal-data.js
      - name: Publish crawlable editorial pages and sitemap
        run: node scripts/generate-editorial-pages.js
      - name: Render direct-source headlines into both crawlable entrypoints
        run: node scripts/render-static-news.js
      - name: Render static home coffee price chart
        run: node scripts/render-static-coffee-price-chart.js
      - name: Generate crawlable coffee data and calculator pages
        run: node scripts/generate-discovery-pages.js
      - name: Render public MEVO report previews into static HTML
        run: node scripts/render-static-mevo-previews.js
      - name: Generate crawlable bilingual weekly coffee briefs
        run: node scripts/generate-weekly-brief.js
      - name: Verify Kabar Kopi entrypoint parity
        run: node scripts/check-kabar-entrypoints.js
      - name: Save private editor cluster queue
        env:
          MEVO_SYNC_SECRET: ${{ secrets.MEVO_SYNC_SECRET }}
        run: |
          if [ -z "$MEVO_SYNC_SECRET" ]; then echo "::warning::Antrean klaster belum dipindah karena secret belum disetel."; exit 0; fi
          endpoint='https://blog-api.qcoid.com/api/internal/cluster-candidates'
          if curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $MEVO_SYNC_SECRET" -H 'Content-Type: application/json' --data-binary @data/cluster-candidates.json "$endpoint" >/dev/null; then rm -f data/cluster-candidates.json; else echo "::warning::Kandidat klaster masih tersimpan di repo publik; jalankan migrasi D1."; fi
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/ analisis-kopi/ data-tren-kopi/ kalkulator-kopi/ persyaratan-ekspor-kopi/ en/ rangkuman-pekanan/ index.html kabar-kopi.html tentang-kabar-kopi.html sitemap.xml
          git diff --staged --quiet || (git commit -m "data: update [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
